; storm4perf.ini: optional; put it next to NSUNS4.exe. Missing keys use the defaults shown.
; Each fix only applies if the game's bytes match Storm 4 1.09; storm4perf.log says what was applied.

[fixes]
; Render thread: read the GPU frame timer without waiting for the GPU (saves about one CPU core).
gputimer=1
; Main thread: wait for GPU skinning with pause/yield/sleep instead of a tight spin.
skinwait=1
; Main thread: sleep until the render thread is free instead of spinning in WaitVSync.
flipwait=1
; Timer reads: stop moving the calling thread to CPU 0 around every QueryPerformanceCounter call.
timeraffinity=1
; VSync callback thread: sleep toward its 16.7 ms deadline instead of Sleep(0) spinning.
vsyncsleep=1
; Physics: leave the 4 Bullet worker threads unpinned (the game pins them to CPUs 0-3).
; Off by default: no measurable effect on 4 or 2 threads.
bulletunpin=0
; Only with in-game vsync=1: after Present the game spins with Sleep(0) until the frame time is up (~1 core).
; This sleeps on a high-resolution timer instead. Saves ~0.8 core, but in 3 of 8 runs (all in one 30-min window while other heavy programs ran)
; it cost ~1-3 FPS (late wake-ups). Off by default; in-game vsync=0 with an external cap is better anyway.
presentpace=0
; How early to wake before the deadline (then spin the rest), and whether to wait at time-critical priority.
presentpace_margin_us=2000
presentpace_boost=1
; Fast-input fix: stop PreCtrl from clearing the command buffer every frame so jutsu/chakra dash inputs
; are not lost when entered within a few frames of chakra charge. Safe: UpdateSuccessCommand has a 5-frame timeout.
inputfix=1

[gpu]
; Shadows. Also set in the game itself: Options > Shadow Quality now offers OFF, VERY LOW, LOW, MEDIUM, HIGH, and
; "Settings Complete" saves the choice here (LOW/MEDIUM/HIGH also go to config.ini shadowQuality, as before).
;   game   = the game's own LOW/MEDIUM/HIGH (config.ini shadowQuality)
;   potato = VERY LOW: 2 shadow cascades at 768/512 px (the game's lowest is 3 at 1536/1536/768). ~5 ms less GPU time
;            per frame at 1080p on an Intel UHD 770; shadows stay, a little softer.
;   off    = OFF: no shadow pass at all (as on a stage without shadows). ~6 ms less at 1080p.
shadows=game
; VERY LOW details: number of cascades (1-4), tile size near,far in px (128-2048), filter blur width cap (0-8).
shadow_cascades=2
shadow_size=768,512
shadow_blur=2
; 1 = add OFF and VERY LOW to the in-game Shadow Quality row (needs the game's own data\ui\flash\OTHER\option\option.gfx;
; nothing in the game folder is changed, the menu is patched in memory). 0 = leave the Options screen untouched.
options_menu=1

[replay]
; Replays: every VS battle in Free Battle (vs CPU or local 2P) is recorded; press Y on the Free Battle menu for the
; replay list (Saved / Recent, Watch, Save, Delete). Watching a replay pauses into playback controls (restart, speed,
; frame advance, HUD). Files: StormReplay\replays\saved and \recent next to the exe.
enabled=1
; 0 = do not record battles automatically (saved replays can still be watched).
auto_record=1
; How many recent battles to keep (oldest removed first). Saved replays are kept until deleted (up to 150).
keep_recent=20

[xinput]
; Empty: forward controller calls to Windows' own xinput9_1_0.dll.
; Or the name of another XInput DLL in the game folder (e.g. a renamed controller mod) to chain to.
forward=

[debug]
; 1 = write storm4perf.log next to the exe (or in %TEMP% if the folder is read-only).
log=1
; 1 = re-read [fixes] while the game runs (for testing). All hooks are installed and switch live.
live=0
